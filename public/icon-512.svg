<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071E2C" />
      <stop offset="50%" stop-color="#132C3C" />
      <stop offset="100%" stop-color="#1B3343" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F9DB5" />
      <stop offset="100%" stop-color="#35B779" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#6F9DB5" stroke-width="6" opacity="0.4" />
  
  <!-- Growth Arrows & Symbol -->
  <g transform="translate(106, 106) scale(0.6)">
    <!-- Tree / Growth Nodes -->
    <circle cx="250" cy="110" r="45" fill="#35B779" filter="url(#glow)" />
    <circle cx="140" cy="270" r="38" fill="#6F9DB5" />
    <circle cx="360" cy="270" r="38" fill="#6F9DB5" />
    <circle cx="70" cy="400" r="32" fill="#35B779" />
    <circle cx="200" cy="400" r="32" fill="#35B779" />
    <circle cx="300" cy="400" r="32" fill="#35B779" />
    <circle cx="430" cy="400" r="32" fill="#35B779" />

    <!-- Connecting Network Lines -->
    <path d="M 250 110 L 140 270 M 250 110 L 360 270 M 140 270 L 70 400 M 140 270 L 200 400 M 360 270 L 300 400 M 360 270 L 430 400" 
          stroke="url(#gold)" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography FG / Future Grow -->
  <text x="256" y="445" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    FUTURE GROW
  </text>
</svg>
